
name: Promote QA Image to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact 40-character commit SHA of the image tested in QA"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  promote:
    name: Deploy Selected Image to Production
    runs-on: ubuntu-latest

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: image_tag must be a 40-character lowercase Git SHA."
            exit 1
          fi

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact image to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo docker pull ghcr.io/jyb4/jyb-deployment:$IMAGE_TAG &&
             sudo docker rm -f jyb-prod &&
             sudo docker run -d --name jyb-prod --restart unless-stopped \
               -p 127.0.0.1:8080:80 \
               ghcr.io/jyb4/jyb-deployment:$IMAGE_TAG"

      - name: Verify production deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'for i in $(seq 1 15); do
               if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
                 echo "Production local health check passed"
                 exit 0
               fi
               sleep 2
             done
             echo "Production health check failed"
             sudo docker logs jyb-prod
             exit 1'

      - name: Verify public HTTPS site
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent https://jybdeployment.com/ >/dev/null; then
              echo "Production HTTPS check passed"
              exit 0
            fi
            sleep 3
          done
          echo "Production HTTPS check failed"
          exit 1
